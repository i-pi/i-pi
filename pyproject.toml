[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
exclude = 'test_properties.py'

[tool.coverage.run]
# i-pi ends with os._exit(), which would otherwise skip saving the coverage data
patch = ["_exit"]
# the systems are stepped in greenlets, and soft exits run in their own thread
concurrency = ["greenlet", "thread"]
