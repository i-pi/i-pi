# Coverage is uploaded by 11 CI jobs (2 unit-test + 2 regression-test matrix
# entries, the 3 array-backend jobs with coverage, and the MACE, metatomic,
# PLUMED and petjax jobs); waits for all of them before computing statuses and
# commenting, so that partial uploads don't trigger spurious low-coverage
# reports. NB: after_n_builds must be kept in sync with the number of jobs that
# upload coverage in .github/workflows/{unit_tests,regression_tests,backends,
# mace,metatomic,plumed,petjax}.yml
codecov:
  notify:
    after_n_builds: 11
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    # the coverage of the changed lines is reported, without failing the checks
    patch:
      default:
        informational: true

comment:
  after_n_builds: 11
  # comments only when the coverage changes
  require_changes: true
