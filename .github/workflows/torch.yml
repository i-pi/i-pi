name: Torch backend

on:
  push:
    branches: [main]
  pull_request:
    # Check all PR

concurrency:
  group: torch-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  torch-backend:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: torch
            name: Unit and regression tests with the torch backend (CPU)
          - toxenv: torch-examples
            name: Examples with the torch backend (CPU)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: install tox
        run: python -m pip install --upgrade pip 'tox>=4'

      - name: tests with the torch backend
        run: tox -e ${{ matrix.toxenv }}
