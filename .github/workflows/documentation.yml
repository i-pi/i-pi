name: Documentation

on:
  push:
    branches: [main, next]
    tags: ["*"]
  pull_request:
    # Check all PR

# deployments run one at a time, as each of them reads the deployed site
concurrency:
  group: ${{ github.event_name == 'push' && 'docs-deploy' || format('docs-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-lang-greek latexmk
      - name: install tox
        run: python -m pip install --upgrade pip 'tox>=4'
      - name: build HTML and PDF docs
        run: |
          tox -e docs
          tox -e docs-pdf
          cp docs/_build/latex/i-pi.pdf docs/_build/html/ipi-manual.pdf
      - name: choose where to deploy
        id: target
        if: github.event_name == 'push'
        run: |
          # the manual of the next branch goes to next/, that of main and of
          # the release tags to the root of the site. Pre-release tags are
          # not deployed
          if [[ "$GITHUB_REF" == refs/heads/next ]]; then
            echo "dir=next" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF_NAME" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
      - name: assemble the site
        if: steps.target.outputs.dir != ''
        env:
          TARGET: ${{ steps.target.outputs.dir }}
        run: |
          # starts from the deployed site, and replaces only the manual that
          # was built: next/, or everything else
          mkdir site
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C site
          fi
          if [[ "$TARGET" == next ]]; then
            rm -rf site/next
          else
            find site -mindepth 1 -maxdepth 1 ! -name next -exec rm -rf {} +
          fi
          mkdir -p "site/$TARGET"
          cp -r docs/_build/html/. "site/$TARGET/"
      - name: deploy to gh-pages
        if: steps.target.outputs.dir != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          cname: docs.ipi-code.org
