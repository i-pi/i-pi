name: PLUMED tests

on:
  pull_request:
  push:
    branches:
      - main
      - next

concurrency:
  group: plumed-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plumed:
    name: PLUMED forcefield and metadynamics
    runs-on: ubuntu-24.04
    defaults:
      run:
        # login shell, which activates the micromamba environment
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PLUMED (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: plumed
          create-args: >-
            python=3.13
            plumed
            py-plumed
          condarc: |
            channels:
              - conda-forge
          init-shell: bash
          cache-environment: true

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install i-PI and torch
        run: |
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"

      - name: Build the Fortran driver
        run: |
          make -C drivers/f90
          ln -fsn "$PWD/bin/i-pi-driver" "$CONDA_PREFIX/bin/i-pi-driver"

      - name: Check that PLUMED can be loaded
        run: python -c "import plumed; plumed.Plumed().finalize()"

      - name: Run PLUMED unit tests
        run: python -m pytest -v -ra --cov=ipi --cov-append ipi_tests/unit_tests/engine/test_plumed_reference.py

      - name: Run PLUMED regression tests (numpy)
        run: python -m pytest -v -ra --cov=ipi --cov-append ipi_tests/regression_tests/test_run.py -k PLUMED

      - name: Run PLUMED regression tests (torch)
        run: |
          python -m pytest -v -ra --cov=ipi --cov-append --cov-report=xml:coverage-plumed.xml \
            ipi_tests/regression_tests/test_run.py -k PLUMED --ipi-backend torch

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-plumed.xml
          fail_ci_if_error: true
