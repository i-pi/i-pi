name: Array backends

on:
  push:
    branches: [main, next]
  pull_request:
    # Check all PR

concurrency:
  group: array-backends-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  array-backends:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: backends-torch
            name: Unit and regression tests with the torch backend (CPU)
            coverage: true
          - toxenv: backends-jax
            name: Regression tests with the JAX backend (CPU)
            coverage: true
          - toxenv: torch-examples
            name: Examples with the torch backend (CPU)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: install tox
        run: python -m pip install --upgrade pip 'tox>=4'

      - name: tests with the array backends
        run: tox -e ${{ matrix.toxenv }}
        env:
          # the examples run i-PI in separate processes, which are not measured
          COVERAGE_FLAGS: ${{ matrix.coverage && '--cov=ipi --cov-append --cov-report=xml:coverage-backends.xml' || '' }}

      - name: upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-backends.xml
          fail_ci_if_error: true
