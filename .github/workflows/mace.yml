name: MACE examples

on:
  pull_request:

concurrency:
  group: mace-examples-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mace-examples:
    name: MACE examples
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install i-PI and MACE
        run: |
          python -m pip install --upgrade pip
          python -m pip install . mace-torch

      - name: Download MACE model for single example
        working-directory: examples/clients/mace/single
        run: bash getmodel.sh

      - name: Run single MACE example
        working-directory: examples/clients/mace/single
        run: i-pi input.xml

      - name: Download MACE model for batched example
        working-directory: examples/clients/mace/batched
        run: bash getmodel.sh

      - name: Run batched MACE example
        working-directory: examples/clients/mace/batched
        run: i-pi input.xml
